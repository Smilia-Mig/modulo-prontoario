    <title>Área do Médico - Módulo Prontuário</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
        <h1>Hospital Digital</h1>
        <p>Painel Clínico de Atendimento</p>

        <nav>
